<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Эмоциональный интеллект — модуль</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; }
    .page { display: flex; flex-direction: column; min-height: 100vh; padding: 1rem; }
    .page-header { flex-shrink: 0; margin-bottom: 1rem; }
    .page-header h1 { margin: 0; font-size: 1.25rem; color: #1e293b; }
    .page-header p { margin: 0.25rem 0 0; font-size: 0.875rem; color: #64748b; }
    .iframe-wrapper { flex: 1; min-height: 0; position: relative; width: 100%; max-width: 1200px; margin: 0 auto; background: #fff; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); overflow: hidden; }
    .iframe-wrapper::before { content: ""; display: block; padding-top: 56.25%; }
    .iframe-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    @media (min-width: 768px) {
      .page { padding: 1.5rem; }
      .page-header h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>Эмоциональный интеллект</h1>
      <p>Твой супернавык для работы и жизни — интерактивный модуль</p>
    </header>
    <div class="iframe-wrapper">
      <iframe src="/Courses/EQ/index.html" title="Курс: Эмоциональный интеллект" allow="fullscreen"></iframe>
    </div>
  </div>
</body>
</html>
